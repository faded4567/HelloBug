name: hellobug
description: "Remote control for local Claude Code / Codex agents."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # routing
  go_router: ^14.6.3

  # serialisation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # secure storage & biometrics
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # networking
  web_socket_channel: ^3.0.2
  web: ^1.1.1
  dio: ^5.8.0+1

  # crypto (Noise IK, ChaCha20-Poly1305)
  cryptography: ^2.7.0

  # QR scanning (pairing)
  mobile_scanner: ^7.0.1

  # highlights (diff / code viewer)
  flutter_highlight: ^0.7.0

  # image & voice (M4 stubs, declared early)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  speech_to_text: ^7.0.0
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1A1A1C"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
