<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>56 · @mention选择</title>
<link rel="stylesheet" href="_common.css">
<style>
.sheet-overlay { position:absolute; inset:0; background:rgba(0,0,0,.45); display:flex; flex-direction:column; justify-content:flex-end; }
.sheet { background:var(--bg1); border-radius:20px 20px 0 0; padding-bottom:env(safe-area-inset-bottom,16px); }
.sheet-handle { width:36px; height:4px; border-radius:2px; background:var(--bg4); margin:10px auto; }
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <div class="phone-label">56 · @mention Agent 选择面板</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg></div></div>

    <!-- dimmed chat behind -->
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative">
      <div style="flex:1;padding:16px;opacity:.3;pointer-events:none">
        <div style="background:var(--bg2);border-radius:12px;padding:10px 14px;margin-bottom:10px;max-width:80%">
          <div style="font-size:13px;color:var(--fg2)">分析完代码结构后，请帮我优化性能</div>
        </div>
      </div>
      <div style="padding:8px 12px;background:var(--bg1);border-top:1px solid var(--bg3);opacity:.3">
        <div style="background:var(--bg2);border-radius:22px;padding:9px 14px;font-size:15px;color:var(--tint)">@</div>
      </div>

      <!-- Sheet -->
      <div class="sheet-overlay">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <div style="padding:0 16px 8px;font-size:16px;font-weight:600">发送给</div>
          <div style="padding:0 16px 12px">
            <input style="width:100%;background:var(--bg2);border-radius:10px;padding:8px 12px;color:var(--fg);font-size:14px;border:none;outline:none" placeholder="搜索 Agent…" />
          </div>

          <div style="overflow-y:auto;max-height:240px">
            <!-- All agents option -->
            <div style="display:flex;align-items:center;padding:11px 16px;gap:12px;border-top:1px solid var(--bg3);background:rgba(10,132,255,.08)">
              <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">👥</div>
              <div style="flex:1">
                <div style="font-size:15px;font-weight:500">所有 Agent</div>
                <div style="font-size:12px;color:var(--fg3)">广播给所有活跃 Agent</div>
              </div>
              <div style="width:20px;height:20px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center">
                <svg viewBox="0 0 12 9" width="12" height="9" fill="none"><polyline points="1,4.5 4.5,8 11,1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
            <div style="display:flex;align-items:center;padding:11px 16px;gap:12px;border-top:1px solid var(--bg3)">
              <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🤖</div>
              <div style="flex:1">
                <div style="font-size:15px">Claude Code #1</div>
                <div style="font-size:12px;color:var(--green)">● 运行中</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;padding:11px 16px;gap:12px;border-top:1px solid var(--bg3)">
              <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#34c759,#30b050);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🤖</div>
              <div style="flex:1">
                <div style="font-size:15px">Claude Code #2</div>
                <div style="font-size:12px;color:var(--fg3)">○ 空闲</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;padding:11px 16px;gap:12px;border-top:1px solid var(--bg3)">
              <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#ff9f0a,#ff6b00);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🤖</div>
              <div style="flex:1">
                <div style="font-size:15px">Codex CLI #3</div>
                <div style="font-size:12px;color:var(--orange)">⏸ 等待确认</div>
              </div>
            </div>
          </div>
          <div style="height:8px"></div>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const h = document.documentElement, d = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme', d ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = d ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
