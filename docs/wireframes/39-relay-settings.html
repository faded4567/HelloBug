<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>39 · 中继服务器设置</title>
<link rel="stylesheet" href="_common.css">
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <!-- A: 默认配置 -->
  <div class="phone-label">39-A · 中继服务器 — 默认配置</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg>
      </div>
    </div>
    <div class="nav">
      <div class="nav-back">
        <svg viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 9l7 8"/></svg>
        设置
      </div>
      <div class="nav-title">中继服务器</div>
    </div>

    <div class="screen-body" style="padding-bottom:32px">
      <div class="section-header">服务器模式</div>
      <div class="list-group">
        <div class="list-item">
          <div style="display:flex;align-items:center;gap:10px;flex:1">
            <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--tint);display:flex;align-items:center;justify-content:center">
              <div style="width:10px;height:10px;border-radius:50%;background:var(--tint)"></div>
            </div>
            <div>
              <div style="font-size:15px">官方服务器</div>
              <div style="font-size:12px;color:var(--fg2);margin-top:2px">relay.hellobug.dev</div>
            </div>
          </div>
          <span class="pill-label green" style="font-size:11px">推荐</span>
        </div>
        <div class="list-item">
          <div style="display:flex;align-items:center;gap:10px;flex:1">
            <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--separator)"></div>
            <div>
              <div style="font-size:15px">自托管服务器</div>
              <div style="font-size:12px;color:var(--fg2);margin-top:2px">自定义地址和端口</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-header">当前状态</div>
      <div class="list-group">
        <div class="list-item">
          <span class="list-label">地址</span>
          <span style="font-family:var(--font-mono);font-size:13px;color:var(--fg2)">relay.hellobug.dev</span>
        </div>
        <div class="list-item">
          <span class="list-label">端口</span>
          <span style="font-family:var(--font-mono);font-size:13px;color:var(--fg2)">443</span>
        </div>
        <div class="list-item">
          <span class="list-label">TLS</span>
          <span class="pill-label green" style="font-size:11px">启用</span>
        </div>
        <div class="list-item">
          <span class="list-label">连接状态</span>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--green)"></div>
            <span style="font-size:14px;color:var(--green)">已连接</span>
          </div>
        </div>
        <div class="list-item">
          <span class="list-label">延迟</span>
          <span style="font-size:14px;color:var(--fg2)">28 ms</span>
        </div>
      </div>

      <div class="section-header">操作</div>
      <div class="list-group">
        <div class="list-item" style="justify-content:center">
          <span style="color:var(--tint);font-size:15px">测试连接</span>
        </div>
      </div>
    </div>
  </div>

  <!-- B: 自托管配置 + 测试成功 -->
  <div class="phone-label">39-B · 中继服务器 — 自托管配置</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg>
      </div>
    </div>
    <div class="nav">
      <div class="nav-back">
        <svg viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 9l7 8"/></svg>
        设置
      </div>
      <div class="nav-title">中继服务器</div>
    </div>

    <div class="screen-body" style="padding-bottom:32px">
      <div class="section-header">服务器模式</div>
      <div class="list-group">
        <div class="list-item">
          <div style="display:flex;align-items:center;gap:10px;flex:1">
            <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--separator)"></div>
            <div>
              <div style="font-size:15px">官方服务器</div>
              <div style="font-size:12px;color:var(--fg2);margin-top:2px">relay.hellobug.dev</div>
            </div>
          </div>
        </div>
        <div class="list-item">
          <div style="display:flex;align-items:center;gap:10px;flex:1">
            <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--tint);display:flex;align-items:center;justify-content:center">
              <div style="width:10px;height:10px;border-radius:50%;background:var(--tint)"></div>
            </div>
            <div>
              <div style="font-size:15px">自托管服务器</div>
              <div style="font-size:12px;color:var(--fg2);margin-top:2px">自定义地址和端口</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-header">服务器地址</div>
      <div class="list-group">
        <div class="list-item">
          <span class="list-label">主机</span>
          <input style="flex:1;background:none;border:none;outline:none;font-size:14px;font-family:var(--font-mono);color:var(--fg);text-align:right" value="my-relay.example.com">
        </div>
        <div class="list-item">
          <span class="list-label">端口</span>
          <input style="width:70px;background:none;border:none;outline:none;font-size:14px;font-family:var(--font-mono);color:var(--fg);text-align:right" value="7890">
        </div>
        <div class="list-item">
          <span class="list-label">TLS</span>
          <div class="switch on"></div>
        </div>
      </div>
      <div style="padding:2px 16px 12px;font-size:12px;color:var(--fg3)">建议保持 TLS 开启以确保传输安全</div>

      <!-- 测试结果 banner -->
      <div class="banner" style="background:rgba(52,199,89,.15);border-left:3px solid var(--green);color:var(--green);margin-bottom:0">
        ✓ 连接成功 · 延迟 42 ms
      </div>

      <div style="margin-top:12px">
        <button class="btn btn-primary" style="width:100%">应用并重连</button>
      </div>
      <div style="margin-top:8px">
        <button class="btn" style="width:100%">测试连接</button>
      </div>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = isDark ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
