<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>16 · 语音输入（长按触发）</title>
<link rel="stylesheet" href="_common.css">
<style>
/* 模拟底部覆盖在聊天页上的录音状态 */
.chat-bg-blur {
  flex: 1; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
  filter: blur(2px); pointer-events: none; overflow: hidden;
}
.voice-overlay-demo {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.72);
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding-bottom: 52px;
}
.voice-cancel-hint {
  font-size: 13px; color: rgba(255,255,255,.45);
  letter-spacing: .02em; margin-top: 8px;
}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <!-- 状态A：录音中 -->
  <div class="phone-label">16-A · 录音中（长按输入框触发）</div>
  <div class="phone" style="position:relative;overflow:hidden">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg>
      </div>
    </div>
    <div class="nav">
      <div class="nav-back"><svg viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,1 2,9 8,17"/></svg> 返回</div>
      <div class="nav-title" style="font-size:15px">HelloBug · Claude Code</div>
      <div class="nav-right">⋯</div>
    </div>

    <!-- 聊天背景（虚化） -->
    <div class="chat-bg-blur">
      <div class="msg me"><div class="bubble">帮我看看 login 接口</div></div>
      <div class="msg ai"><div class="bubble">我先查看相关文件…</div></div>
    </div>

    <!-- 输入栏（虚化） -->
    <div class="input-bar" style="filter:blur(2px);pointer-events:none">
      <div class="input-row">
        <div class="input-field" style="color:var(--fg3)">按住说话</div>
        <button class="input-action">＋</button>
      </div>
    </div>

    <!-- 录音覆盖层 -->
    <div class="voice-overlay-demo">
      <!-- 实时转写 -->
      <div style="background:rgba(28,28,30,.9);border-radius:var(--r);padding:14px 18px;width:80%;margin-bottom:28px;font-size:15px;line-height:1.6;color:#fff;text-align:center">
        帮我看一下 login 接口有没有问题<span style="display:inline-block;width:2px;height:18px;background:var(--tint);vertical-align:text-bottom;margin-left:2px;animation:blink 1s step-end infinite"></span>
      </div>
      <!-- 波形 -->
      <div class="waveform" style="width:70%;margin-bottom:16px">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
      <!-- 计时 -->
      <div style="font-size:40px;font-weight:200;font-family:var(--font-mono);color:#fff;letter-spacing:.05em;margin-bottom:12px">0:08</div>
      <!-- 提示 -->
      <div style="font-size:14px;color:rgba(255,255,255,.55);margin-bottom:32px">松开发送 · 上划取消</div>
      <!-- 麦克风按钮 -->
      <div style="width:72px;height:72px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 0 14px rgba(10,132,255,.15)">🎤</div>
    </div>
  </div>

  <!-- 状态B：上划 → 取消 -->
  <div class="phone-label">16-B · 上划取消</div>
  <div class="phone" style="position:relative;overflow:hidden">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg>
      </div>
    </div>
    <div class="nav">
      <div class="nav-back"><svg viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,1 2,9 8,17"/></svg> 返回</div>
      <div class="nav-title" style="font-size:15px">HelloBug · Claude Code</div>
      <div class="nav-right">⋯</div>
    </div>
    <div class="chat-bg-blur">
      <div class="msg me"><div class="bubble">帮我看看 login 接口</div></div>
      <div class="msg ai"><div class="bubble">我先查看相关文件…</div></div>
    </div>
    <div class="input-bar" style="filter:blur(2px);pointer-events:none">
      <div class="input-row">
        <div class="input-field" style="color:var(--fg3)">按住说话</div>
        <button class="input-action">＋</button>
      </div>
    </div>
    <div class="voice-overlay-demo" style="background:rgba(0,0,0,.82)">
      <div style="background:rgba(255,59,48,.18);border:1px solid rgba(255,59,48,.4);border-radius:var(--r);padding:10px 20px;margin-bottom:28px;font-size:14px;color:#ff453a;font-weight:600">取消发送</div>
      <div class="waveform" style="width:70%;margin-bottom:16px;opacity:.3">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
      <div style="font-size:40px;font-weight:200;font-family:var(--font-mono);color:rgba(255,255,255,.4);letter-spacing:.05em;margin-bottom:12px">0:08</div>
      <div style="font-size:14px;color:rgba(255,255,255,.4);margin-bottom:32px">松开取消</div>
      <div style="width:72px;height:72px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:32px">✕</div>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const btn = document.querySelector('.theme-toggle');
  if (html.dataset.theme === 'dark') { html.dataset.theme = 'light'; btn.textContent = '🌙 深色'; }
  else { html.dataset.theme = 'dark'; btn.textContent = '☀ 浅色'; }
}
</script>
</body>
</html>
