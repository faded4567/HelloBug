<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>HelloBug · 操作流程图</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0d0f; overflow: hidden; width: 100vw; height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; }
#viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
#viewport.dragging { cursor: grabbing; }
#canvas { position: absolute; transform-origin: 0 0; }
svg#arrowlayer { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
.node { position: absolute; width: 120px; cursor: pointer; }
.node-card {
  width: 120px; background: #1c1c1e; border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,.1);
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.node:hover .node-card { border-color: rgba(255,255,255,.3); box-shadow: 0 8px 28px rgba(0,0,0,.5); }
.thumb { width: 120px; height: 195px; overflow: hidden; background: #111; }
.thumb iframe {
  width: 390px; height: 844px;
  transform: scale(0.3077); transform-origin: 0 0;
  pointer-events: none; border: none; display: block;
}
.node-label {
  padding: 6px 4px 0; font-size: 11px; font-weight: 600;
  line-height: 1.3; color: #aeaeb2; text-align: center;
}
.node-num { font-size: 10px; color: #48484a; font-family: monospace; }
.edge-label {
  position: absolute; pointer-events: none;
  font-size: 10px; white-space: nowrap;
  padding: 2px 6px; border-radius: 4px;
  font-weight: 500;
}
.hint {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,.3); font-size: 12px; pointer-events: none;
}
.legend {
  position: fixed; top: 16px; left: 16px;
  background: rgba(28,28,30,.9); border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px; padding: 10px 14px; font-size: 11px;
  display: flex; gap: 14px; backdrop-filter: blur(8px);
}
.leg { display: flex; align-items: center; gap: 5px; color: #aeaeb2; }
.leg-line { width: 24px; height: 2px; border-radius: 1px; }
</style>
</head>
<body>
<div id="viewport">
  <div id="canvas">
    <svg id="arrowlayer"></svg>
  </div>
</div>
<div class="legend">
  <div class="leg"><div class="leg-line" style="background:#34c759"></div>成功 / 下一步</div>
  <div class="leg"><div class="leg-line" style="background:#ff453a"></div>失败 / 取消</div>
  <div class="leg"><div class="leg-line" style="background:#0a84ff"></div>操作触发</div>
  <div class="leg"><div class="leg-line" style="background:#ff9f0a;height:1px;border-top:2px dashed #ff9f0a;background:none;"></div>可选路径</div>
</div>
<div class="hint">滚轮缩放 · 拖拽平移 · 双击进入页面</div>

  { id:'grp_add',    label:'新增Agent',      num:'55', url:'55-group-add-agent.html',         x:480,  y:2440 },
  { id:'mention',    label:'@mention选择',   num:'56', url:'56-mention-agent.html',           x:700,  y:2440 },
  { id:'routing',    label:'路由方式选择',   num:'57', url:'57-agent-routing.html',           x:920,  y:2440 },
  { id:'agent_stat', label:'Agent运行状态',  num:'58', url:'58-agent-status-detail.html',     x:1140, y:2440 },
  { id:'hist_agent',  label:'按Agent筛选历史', num:'59', url:'59-history-by-agent.html',      x:1360, y:2440 },
  { id:'ws_perm',     label:'工作区权限受限',  num:'60', url:'60-workspace-permission.html',  x:1580, y:2100 },
];

// type: 'ok'=green, 'fail'=red, 'action'=blue, 'opt'=orange-dashed
// from/to: node id; fromPort: 'r','b','l','t' (right/bottom/left/top)
const edges = [
  // Onboarding
  { from:'onboard', to:'pair',   label:'首次启动', type:'ok' },
  { from:'onboard', to:'unlock', label:'已有设备', type:'opt', fromPort:'b', toPort:'t' },
  { from:'unlock',  to:'devices',label:'验证通过', type:'ok', fromPort:'r' },

  // Pairing
  { from:'pair',   to:'qr',     label:'扫码',    type:'action' },
  { from:'pair',   to:'manual', label:'手动输入', type:'action' },
  { from:'qr',     to:'sas',    label:'', type:'ok' },
  { from:'manual', to:'sas',    label:'', type:'ok' },
  { from:'sas', to:'devices', label:'双端确认', type:'ok' },
  { from:'sas', to:'pair',    label:'拒绝/重试', type:'fail', fromPort:'b', toPort:'b' },

  // Device
  { from:'devices', to:'ws_home',    label:'进入',   type:'ok' },
  { from:'devices', to:'dev_detail', label:'查看详情', type:'action', fromPort:'b', toPort:'t' },

  // Workspace → Session
  { from:'ws_home', to:'sess_list', label:'选工作区', type:'ok' },
  { from:'ws_home', to:'new_sess',  label:'新建会话', type:'action' },
  { from:'sess_list', to:'chat',       label:'选择会话', type:'ok' },
  { from:'sess_list', to:'search',     label:'搜索',     type:'action' },
  { from:'sess_list', to:'hist_list',  label:'历史记录', type:'opt', fromPort:'b', toPort:'t' },
  { from:'hist_list', to:'hist_detail',label:'查看详情', type:'action' },
  { from:'new_sess',    to:'new_confirm', label:'下一步',  type:'ok' },
  { from:'new_confirm', to:'chat',        label:'确认创建', type:'ok', fromPort:'r', toPort:'b' },

  // Chat → col-1
  { from:'chat', to:'danger',   label:'危险指令', type:'action', fromPort:'r', toPort:'l' },
  { from:'chat', to:'diff',     label:'查看Diff', type:'action' },
  { from:'chat', to:'filetree', label:'文件树',   type:'action', fromPort:'r', toPort:'l' },
  { from:'chat', to:'reconnect',label:'连接断开', type:'fail',   fromPort:'b', toPort:'l' },
  { from:'chat', to:'terminal_sb', label:'打开终端', type:'action', fromPort:'r', toPort:'l' },
  { from:'danger',   to:'chat', label:'Face ID通过', type:'ok',   fromPort:'l', toPort:'t' },
  { from:'danger',   to:'chat', label:'拒绝',        type:'fail', fromPort:'b', toPort:'t' },
  { from:'filetree', to:'fileprev', label:'打开文件', type:'action' },
  { from:'reconnect',to:'chat',    label:'重连成功', type:'ok',   fromPort:'t', toPort:'b' },
  { from:'reconnect',to:'devices', label:'重连失败', type:'fail', fromPort:'b' },

  // Chat → col-2
  { from:'chat', to:'ws_switcher', label:'切换工作区', type:'action', fromPort:'r', toPort:'l' },
  { from:'chat', to:'slash',      label:'斜杠命令',   type:'action', fromPort:'r', toPort:'l' },
  { from:'chat', to:'media_drawer',label:'点击+',     type:'action', fromPort:'r', toPort:'l' },
  { from:'chat', to:'voice_input',label:'长按输入框', type:'action', fromPort:'r', toPort:'l' },
  { from:'media_drawer', to:'img_input', label:'相机/相册', type:'ok' },
  { from:'chat', to:'msg_actions',label:'长按消息',   type:'action', fromPort:'r', toPort:'l' },
  { from:'chat', to:'sess_info',  label:'会话信息',   type:'action', fromPort:'r', toPort:'l' },
  { from:'sess_info', to:'filetree', label:'文件树(运行中)', type:'action', fromPort:'l', toPort:'r' },
  { from:'diff',      to:'filetree', label:'对应文件 ↗',    type:'action', fromPort:'r', toPort:'l' },
  { from:'chat', to:'sess_tabs',  label:'多会话',     type:'action', fromPort:'r', toPort:'l' },
  { from:'chat', to:'landscape',  label:'横屏',       type:'opt',    fromPort:'r', toPort:'l' },

  // Settings row-1
  { from:'settings', to:'security',     label:'', type:'action' },
  { from:'settings', to:'danger_rules', label:'', type:'action' },
  { from:'settings', to:'templates',    label:'', type:'action' },
  { from:'settings', to:'relay',        label:'', type:'action' },
  { from:'danger_rules', to:'rule_form',  label:'新建/编辑', type:'action' },
  // Settings row-2
  { from:'settings',  to:'appearance',    label:'', type:'action', fromPort:'b', toPort:'t' },
  { from:'settings',  to:'notifications', label:'', type:'action', fromPort:'b', toPort:'t' },
  { from:'settings',  to:'about',         label:'', type:'action', fromPort:'b', toPort:'t' },
  { from:'templates', to:'tmpl_form',     label:'新建/编辑', type:'action', fromPort:'b', toPort:'t' },

  // 导航重设计
  { from:'tab2',    to:'ws_home',     label:'进入', type:'ok' },
  { from:'ws_home', to:'ws_settings', label:'设置', type:'action', fromPort:'b', toPort:'t' },
  { from:'chat',      to:'push_land',  label:'通知到达',  type:'opt',    fromPort:'b', toPort:'t' },
  { from:'push_land', to:'chat',       label:'跳转会话',  type:'ok' },
  { from:'push_land', to:'danger',     label:'待确认',    type:'action' },
  { from:'ws_home',   to:'ws_perm',    label:'权限不足',  type:'fail',   fromPort:'b', toPort:'t' },
  { from:'ws_perm',   to:'ws_home',    label:'已修复',    type:'ok' },
  { from:'search',    to:'chat',       label:'打开结果',  type:'ok' },
  { from:'hist_detail', to:'chat',     label:'恢复会话',  type:'ok' },
  { from:'tab2', to:'devices',  label:'设备管理入口', type:'ok' },
  { from:'tab2', to:'settings', label:'设置', type:'ok' },

  // Error / State
  { from:'onboard',   to:'startup',    label:'冷启动',  type:'action', fromPort:'b', toPort:'t' },
  { from:'devices',   to:'dev_revoked',label:'已吊销',  type:'fail',   fromPort:'b', toPort:'t' },
  { from:'pair',      to:'pair_exp',   label:'码过期',  type:'fail',   fromPort:'b', toPort:'t' },
  { from:'ws_home',   to:'ws_invalid', label:'路径失效', type:'fail',  fromPort:'b', toPort:'t' },
  { from:'ws_home',   to:'ws_empty',   label:'首次进入', type:'opt',   fromPort:'b', toPort:'t' },
  { from:'ws_home',   to:'ws_new',     label:'新建',    type:'action', fromPort:'b', toPort:'t' },
  { from:'sess_list', to:'sess_404',   label:'会话丢失', type:'fail',  fromPort:'b', toPort:'t' },

  // Group Agent
  { from:'chat',      to:'grp_agents', label:'Agent列表', type:'action', fromPort:'b', toPort:'t' },
  { from:'grp_agents',to:'grp_add',    label:'+添加',     type:'action' },
  { from:'grp_agents',to:'routing',    label:'路由设置',  type:'action' },
  { from:'grp_agents',to:'agent_stat', label:'查看状态',  type:'action' },
  { from:'chat',      to:'mention',    label:'@mention',  type:'action', fromPort:'b', toPort:'t' },
  { from:'hist_list', to:'hist_agent', label:'按Agent筛', type:'action' },
];

const COLOR = { ok:'#34c759', fail:'#ff453a', action:'#0a84ff', opt:'#ff9f0a' };

// ── Build DOM ──
const canvas = document.getElementById('canvas');
const svg = document.getElementById('arrowlayer');
const ns = 'http://www.w3.org/2000/svg';

// Compute canvas bounding box
const pad = 40;
let maxX = 0, maxY = 0;
for (const n of nodes) { maxX = Math.max(maxX, n.x + NW + pad); maxY = Math.max(maxY, n.y + NH + pad); }
canvas.style.width = maxX + 'px'; canvas.style.height = maxY + 'px';
svg.setAttribute('width', maxX); svg.setAttribute('height', maxY);

// Arrowhead markers
const defs = document.createElementNS(ns, 'defs');
for (const [type, color] of Object.entries(COLOR)) {
  const marker = document.createElementNS(ns, 'marker');
  marker.setAttribute('id', 'arr-' + type);
  marker.setAttribute('markerWidth', '8'); marker.setAttribute('markerHeight', '8');
  marker.setAttribute('refX', '6'); marker.setAttribute('refY', '3');
  marker.setAttribute('orient', 'auto');
  const poly = document.createElementNS(ns, 'polygon');
  poly.setAttribute('points', '0 0, 8 3, 0 6'); poly.setAttribute('fill', color);
  marker.appendChild(poly); defs.appendChild(marker);
}
svg.appendChild(defs);

// Node map for position lookup
const nmap = {};
for (const n of nodes) nmap[n.id] = n;

function port(n, side) {
  const cx = n.x + NW / 2, cy = n.y + NH / 2;
  if (side === 'r') return [n.x + NW, cy];
  if (side === 'l') return [n.x, cy];
  if (side === 't') return [cx, n.y];
  if (side === 'b') return [cx, n.y + NH];
  return [n.x + NW, cy]; // default right
}

function autoPort(sn, tn) {
  const sc = [sn.x + NW/2, sn.y + NH/2];
  const tc = [tn.x + NW/2, tn.y + NH/2];
  const dx = tc[0] - sc[0], dy = tc[1] - sc[1];
  if (Math.abs(dx) >= Math.abs(dy)) {
    return dx >= 0 ? ['r','l'] : ['l','r'];
  } else {
    return dy >= 0 ? ['b','t'] : ['t','b'];
  }
}

function mkPath(x1,y1,x2,y2,sp,tp) {
  // cubic bezier
  let c1x,c1y,c2x,c2y;
  if (sp==='r'||sp==='l') { const m=(x1+x2)/2; c1x=m;c1y=y1;c2x=m;c2y=y2; }
  else if (sp==='b'||sp==='t') { const m=(y1+y2)/2; c1x=x1;c1y=m;c2x=x2;c2y=m; }
  else { c1x=(x1+x2)/2;c1y=y1;c2x=(x1+x2)/2;c2y=y2; }
  return `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`;
}

for (const e of edges) {
  const sn = nmap[e.from], tn = nmap[e.to];
  if (!sn || !tn) continue;
  const [sp, tp] = e.fromPort && e.toPort ? [e.fromPort, e.toPort]
    : e.fromPort ? [e.fromPort, autoPort(sn,tn)[1]]
    : e.toPort   ? [autoPort(sn,tn)[0], e.toPort]
    : autoPort(sn,tn);
  const [x1,y1] = port(sn,sp), [x2,y2] = port(tn,tp);
  // arrow offset from endpoint (don't overlap node border)
  const off = 4;
  const tx2 = tp==='l' ? x2-off : tp==='r' ? x2+off : x2;
  const ty2 = tp==='t' ? y2-off : tp==='b' ? y2+off : y2;

  const path = document.createElementNS(ns,'path');
  path.setAttribute('d', mkPath(x1,y1,tx2,ty2,sp,tp));
  path.setAttribute('fill','none');
  path.setAttribute('stroke', COLOR[e.type]||'#888');
  path.setAttribute('stroke-width', e.type==='opt'?1.5:2);
  if (e.type==='opt') path.setAttribute('stroke-dasharray','5,4');
  path.setAttribute('marker-end', `url(#arr-${e.type})`);
  path.setAttribute('opacity','0.75');
  svg.appendChild(path);

  if (e.label) {
    const mx=(x1+tx2)/2, my=(y1+ty2)/2;
    const fo = document.createElementNS(ns,'foreignObject');
    fo.setAttribute('x', mx-50); fo.setAttribute('y', my-11);
    fo.setAttribute('width',100); fo.setAttribute('height',22);
    fo.setAttribute('overflow','visible');
    const div = document.createElement('div');
    div.className = 'edge-label';
    div.style.cssText = `color:${COLOR[e.type]};background:rgba(13,13,15,.8);border:1px solid ${COLOR[e.type]}44;left:50%;transform:translateX(-50%)`;
    div.textContent = e.label;
    fo.appendChild(div); svg.appendChild(fo);
  }
}

// Nodes
for (const n of nodes) {
  const div = document.createElement('div');
  div.className = 'node';
  div.style.left = n.x + 'px'; div.style.top = n.y + 'px';
  div.title = n.label;
  div.innerHTML = `
    <div class="node-card"><div class="thumb"><iframe src="${n.url}" loading="lazy" tabindex="-1"></iframe></div></div>
    <div class="node-label"><div class="node-num">${n.num}</div>${n.label}</div>`;
  div.addEventListener('dblclick', () => location.href = n.url);
  canvas.appendChild(div);
}

// ── Pan + Zoom ──
let tx = 60, ty = 60, sc = 0.55;
const vp = document.getElementById('viewport');
const apply = () => canvas.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
apply();

vp.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.91;
  const r = vp.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  tx = mx + (tx - mx) * f; ty = my + (ty - my) * f; sc *= f;
  apply();
}, { passive: false });

let drag = null;
vp.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  drag = { x: e.clientX - tx, y: e.clientY - ty };
  vp.classList.add('dragging');
});
window.addEventListener('mousemove', e => { if (!drag) return; tx = e.clientX-drag.x; ty = e.clientY-drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; vp.classList.remove('dragging'); });
</script>
</body>
</html>
