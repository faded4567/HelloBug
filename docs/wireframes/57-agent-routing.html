<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>57 · 路由方式选择</title>
<link rel="stylesheet" href="_common.css">
<style>
.sheet-overlay { position:absolute; inset:0; background:rgba(0,0,0,.45); display:flex; flex-direction:column; justify-content:flex-end; }
.sheet { background:var(--bg1); border-radius:20px 20px 0 0; }
.sheet-handle { width:36px; height:4px; border-radius:2px; background:var(--bg4); margin:10px auto; }
.route-item { display:flex; align-items:center; padding:14px 16px; gap:14px; border-top:1px solid var(--bg3); }
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <div class="phone-label">57 · Agent 路由方式选择</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg></div></div>

    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative">
      <div style="flex:1;opacity:.25;pointer-events:none;padding:16px">
        <div style="font-size:13px;color:var(--fg2);text-align:center">群组会话内容</div>
      </div>
      <div class="sheet-overlay">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <div style="padding:0 16px 12px;font-size:16px;font-weight:600">消息路由方式</div>

          <div class="route-item" style="background:rgba(10,132,255,.08)">
            <div style="width:40px;height:40px;border-radius:12px;background:rgba(10,132,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">📢</div>
            <div style="flex:1">
              <div style="font-size:15px;font-weight:500">广播</div>
              <div style="font-size:12px;color:var(--fg3);margin-top:2px">所有 Agent 都收到这条消息</div>
            </div>
            <div style="width:20px;height:20px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg viewBox="0 0 12 9" width="12" height="9" fill="none"><polyline points="1,4.5 4.5,8 11,1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div class="route-item">
            <div style="width:40px;height:40px;border-radius:12px;background:rgba(52,199,89,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🔄</div>
            <div style="flex:1">
              <div style="font-size:15px;font-weight:500">轮询</div>
              <div style="font-size:12px;color:var(--fg3);margin-top:2px">依次分配给下一个空闲 Agent</div>
            </div>
            <div style="width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bg4);flex-shrink:0"></div>
          </div>
          <div class="route-item">
            <div style="width:40px;height:40px;border-radius:12px;background:rgba(255,149,0,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🎯</div>
            <div style="flex:1">
              <div style="font-size:15px;font-weight:500">指定 Agent</div>
              <div style="font-size:12px;color:var(--fg3);margin-top:2px">通过 @mention 选择特定 Agent</div>
            </div>
            <div style="width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bg4);flex-shrink:0"></div>
          </div>
          <div class="route-item" style="border-bottom:none">
            <div style="width:40px;height:40px;border-radius:12px;background:rgba(94,92,230,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🧠</div>
            <div style="flex:1">
              <div style="font-size:15px;font-weight:500">自动分配</div>
              <div style="font-size:12px;color:var(--fg3);margin-top:2px">根据 Agent 负载自动选择</div>
            </div>
            <div style="width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bg4);flex-shrink:0"></div>
          </div>
          <div style="padding:12px 16px 8px">
            <button style="width:100%;background:var(--bg2);color:var(--fg3);border-radius:var(--r);padding:12px;font-size:15px;border:none">取消</button>
          </div>
          <div style="height:12px"></div>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const h = document.documentElement, d = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme', d ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = d ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
