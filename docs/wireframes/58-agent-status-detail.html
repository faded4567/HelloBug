<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>58 · Agent运行状态详情</title>
<link rel="stylesheet" href="_common.css">
<style>
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-sm { width:12px; height:12px; border-radius:50%; border:1.5px solid transparent; border-top-color:var(--green); animation:spin .7s linear infinite; display:inline-block; }
.log-line { font-family:var(--font-mono); font-size:11px; color:var(--fg3); padding:2px 0; border-bottom:1px solid var(--bg3); }
.log-line:last-child { border-bottom:none; }
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <div class="phone-label">58 · Agent 运行状态详情</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg></div></div>

    <div class="nav">
      <button style="color:var(--tint);font-size:16px;background:none;border:none">‹</button>
      <div class="nav-title">Claude Code #1</div>
      <button style="color:var(--red);font-size:13px;background:none;border:none">停止</button>
    </div>

    <div class="screen-body" style="padding:12px 16px;gap:14px">
      <!-- Status card -->
      <div style="background:var(--bg2);border-radius:var(--r);padding:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <div class="spinner-sm"></div>
          <div style="font-size:15px;font-weight:600;color:var(--green)">运行中</div>
          <div style="margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--fg3)">2:34</div>
        </div>
        <div style="font-size:13px;color:var(--fg2);background:var(--bg3);border-radius:8px;padding:8px 10px;font-family:var(--font-mono)">
          正在分析 package.json 依赖树…
        </div>
      </div>

      <!-- Stats -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div style="background:var(--bg2);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:var(--tint)">47</div>
          <div style="font-size:10px;color:var(--fg3);margin-top:2px">工具调用</div>
        </div>
        <div style="background:var(--bg2);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:18px;font-weight:700">12</div>
          <div style="font-size:10px;color:var(--fg3);margin-top:2px">文件已读</div>
        </div>
        <div style="background:var(--bg2);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:var(--green)">3</div>
          <div style="font-size:10px;color:var(--fg3);margin-top:2px">文件已写</div>
        </div>
      </div>

      <!-- Log -->
      <div>
        <div style="font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">最近日志</div>
        <div style="background:var(--bg2);border-radius:var(--r);padding:10px 12px">
          <div class="log-line">→ read /package.json</div>
          <div class="log-line">→ read /package-lock.json</div>
          <div class="log-line">→ bash: npm ls --depth=3</div>
          <div class="log-line">→ read /src/index.ts</div>
          <div class="log-line" style="color:var(--green)">→ write /analysis.md</div>
          <div class="log-line" style="color:var(--tint)">… 分析依赖冲突</div>
        </div>
      </div>

      <!-- Workspace -->
      <div>
        <div style="font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">工作区</div>
        <div style="background:var(--bg2);border-radius:var(--r);padding:11px 14px;font-size:13px;font-family:var(--font-mono);color:var(--fg3)">/Users/shuai/Projects/HelloBug</div>
      </div>

      <button style="width:100%;background:rgba(255,59,48,.1);color:var(--red);border-radius:var(--r);padding:12px;font-size:14px;border:1px solid rgba(255,59,48,.2)">强制终止此 Agent</button>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const h = document.documentElement, d = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme', d ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = d ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
