<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>55 · 新增Agent</title>
<link rel="stylesheet" href="_common.css">
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <div class="phone-label">55 · 群组会话新增 Agent</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg></div></div>

    <div class="nav">
      <button style="color:var(--tint);font-size:16px;background:none;border:none">取消</button>
      <div class="nav-title">添加 Agent</div>
      <button style="color:var(--tint);font-size:16px;background:none;border:none;font-weight:600">添加</button>
    </div>

    <div class="screen-body" style="padding:16px;gap:20px">
      <div>
        <div style="font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:4px">选择 Agent 类型</div>
        <div style="background:var(--bg2);border-radius:var(--r);overflow:hidden">
          <div style="display:flex;align-items:center;padding:13px 14px;gap:12px;border-bottom:1px solid var(--bg3);background:rgba(10,132,255,.08)">
            <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;font-size:16px">🤖</div>
            <div style="flex:1">
              <div style="font-size:15px">Claude Code</div>
              <div style="font-size:12px;color:var(--fg3)">claude-sonnet-4-5</div>
            </div>
            <div style="width:20px;height:20px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center">
              <svg viewBox="0 0 12 9" width="12" height="9" fill="none"><polyline points="1,4.5 4.5,8 11,1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div style="display:flex;align-items:center;padding:13px 14px;gap:12px">
            <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#34c759,#30b050);display:flex;align-items:center;justify-content:center;font-size:16px">🤖</div>
            <div style="flex:1">
              <div style="font-size:15px">Codex CLI</div>
              <div style="font-size:12px;color:var(--fg3)">gpt-4o</div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div style="font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:4px">初始任务（可选）</div>
        <textarea style="width:100%;background:var(--bg2);border:1px solid var(--bg4);border-radius:10px;padding:10px 12px;color:var(--fg);font-size:14px;resize:none;height:80px;outline:none" placeholder="给这个 Agent 分配一个起始任务…"></textarea>
      </div>

      <div>
        <div style="font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:4px">工作区</div>
        <div style="background:var(--bg2);border-radius:var(--r);overflow:hidden">
          <div style="display:flex;align-items:center;padding:12px 14px;justify-content:space-between">
            <div>
              <div style="font-size:15px">HelloBug</div>
              <div style="font-size:12px;color:var(--fg3);font-family:var(--font-mono)">/Users/shuai/Projects/HelloBug</div>
            </div>
            <div style="color:var(--tint);font-size:13px">更改 ›</div>
          </div>
        </div>
      </div>

      <div>
        <div style="font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:4px">并行限制</div>
        <div style="background:var(--bg2);border-radius:var(--r);overflow:hidden">
          <div style="display:flex;align-items:center;padding:12px 14px;justify-content:space-between">
            <div style="font-size:15px">最大并行数</div>
            <div style="display:flex;align-items:center;gap:12px">
              <button style="width:28px;height:28px;border-radius:50%;background:var(--bg4);color:var(--fg);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0">−</button>
              <span style="font-size:17px;font-weight:600;min-width:20px;text-align:center">3</span>
              <button style="width:28px;height:28px;border-radius:50%;background:var(--tint);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const h = document.documentElement, d = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme', d ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = d ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
