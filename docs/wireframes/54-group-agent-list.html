<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>54 · 群组Agent列表</title>
<link rel="stylesheet" href="_common.css">
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <div class="phone-label">54 · 群组会话 Agent 列表</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg></div></div>

    <div class="nav">
      <button style="color:var(--tint);font-size:16px;background:none;border:none">‹</button>
      <div class="nav-title">Agents <span style="font-size:12px;color:var(--fg3);font-weight:400">· 3 个活跃</span></div>
      <button style="color:var(--tint);font-size:22px;background:none;border:none;line-height:1">+</button>
    </div>

    <div class="screen-body" style="padding:12px 0;gap:0">
      <!-- Agent items -->
      <div style="padding:0 16px 8px;font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em">活跃 Agent</div>

      <div style="background:var(--bg2);margin:0 12px;border-radius:var(--r);overflow:hidden;margin-bottom:16px">
        <!-- Agent 1 - running -->
        <div style="display:flex;align-items:center;padding:12px 14px;gap:12px;border-bottom:1px solid var(--bg3)">
          <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🤖</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:500">Claude Code <span style="font-size:11px;color:var(--fg3);font-weight:400">#1</span></div>
            <div style="font-size:12px;color:var(--green);margin-top:1px">● 运行中 · 分析依赖树</div>
          </div>
          <div style="font-size:11px;color:var(--fg3);font-family:var(--font-mono)">2:14</div>
        </div>
        <!-- Agent 2 - idle -->
        <div style="display:flex;align-items:center;padding:12px 14px;gap:12px;border-bottom:1px solid var(--bg3)">
          <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#34c759,#30b050);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🤖</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:500">Claude Code <span style="font-size:11px;color:var(--fg3);font-weight:400">#2</span></div>
            <div style="font-size:12px;color:var(--fg3);margin-top:1px">○ 空闲 · 等待分配</div>
          </div>
          <div style="font-size:11px;color:var(--fg3);font-family:var(--font-mono)">0:00</div>
        </div>
        <!-- Agent 3 - waiting -->
        <div style="display:flex;align-items:center;padding:12px 14px;gap:12px">
          <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff9f0a,#ff6b00);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🤖</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:500">Codex CLI <span style="font-size:11px;color:var(--fg3);font-weight:400">#3</span></div>
            <div style="font-size:12px;color:var(--orange);margin-top:1px">⏸ 等待确认</div>
          </div>
          <div style="font-size:11px;color:var(--orange);font-size:10px">需要操作</div>
        </div>
      </div>

      <div style="padding:0 16px 8px;font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em">路由策略</div>
      <div style="background:var(--bg2);margin:0 12px;border-radius:var(--r);overflow:hidden;margin-bottom:16px">
        <div style="display:flex;align-items:center;padding:12px 14px;justify-content:space-between">
          <div style="font-size:15px">当前策略</div>
          <div style="display:flex;align-items:center;gap:4px;color:var(--tint);font-size:14px">广播模式 ›</div>
        </div>
      </div>

      <div style="padding:0 12px">
        <button style="width:100%;background:rgba(255,59,48,.1);color:var(--red);border-radius:var(--r);padding:12px;font-size:15px;border:1px solid rgba(255,59,48,.2)">终止所有 Agent</button>
      </div>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const h = document.documentElement, d = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme', d ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = d ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
