<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>53 · 推送落地跳转</title>
<link rel="stylesheet" href="_common.css">
<style>
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width:24px; height:24px; border-radius:50%; border:2.5px solid var(--bg4); border-top-color:var(--tint); animation:spin .8s linear infinite; }
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <div class="phone-label">53-A · 推送落地 — 跳转中</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg></div></div>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px">
      <div class="spinner"></div>
      <div style="font-size:15px;font-weight:500">正在跳转到会话…</div>
      <div style="font-size:12px;color:var(--fg3);text-align:center;line-height:1.6">
        来自推送通知：<br>
        Agent 完成了任务
      </div>
    </div>
  </div>

  <div class="phone-label">53-B · 推送落地 — 需要危险操作确认</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg></div></div>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center">
      <div style="font-size:44px">⚠️</div>
      <div style="font-size:17px;font-weight:600;color:var(--orange)">Agent 等待你的确认</div>
      <div style="background:rgba(255,149,0,.1);border:1px solid rgba(255,149,0,.2);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left">
        <div style="font-size:12px;color:var(--orange);margin-bottom:6px">待执行操作</div>
        <div style="font-family:var(--font-mono);font-size:13px;color:var(--fg);line-height:1.6">
          rm -rf ./node_modules<br>
          npm install --legacy-peer-deps
        </div>
      </div>
      <div style="font-size:12px;color:var(--fg3)">在 HelloBug 工作区 · 3 分钟前触发</div>
      <div style="width:100%;display:flex;flex-direction:column;gap:8px;margin-top:4px">
        <button class="btn btn-primary" style="width:100%;background:var(--orange)">查看详情并确认</button>
        <button style="color:var(--red);font-size:14px;padding:8px">直接拒绝</button>
      </div>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const h = document.documentElement, d = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme', d ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = d ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
