<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>32 · 新建会话确认页</title>
<link rel="stylesheet" href="_common.css">
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">
  <div class="phone-label">32 · 新建会话 — 确认</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg>
      </div>
    </div>

    <div class="nav">
      <div class="nav-back">
        <svg viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 9l7 8"/></svg>
        返回
      </div>
      <div class="nav-title">确认配置</div>
    </div>

    <!-- 步骤指示器 -->
    <div style="display:flex;align-items:center;padding:12px 24px;gap:0;border-bottom:1px solid var(--separator)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
        <div style="width:24px;height:24px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff">✓</div>
        <span style="font-size:10px;color:var(--fg2)">选设备</span>
      </div>
      <div style="flex:1;height:2px;background:var(--tint);margin-bottom:16px"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
        <div style="width:24px;height:24px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff">✓</div>
        <span style="font-size:10px;color:var(--fg2)">选工作区</span>
      </div>
      <div style="flex:1;height:2px;background:var(--tint);margin-bottom:16px"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
        <div style="width:24px;height:24px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff">3</div>
        <span style="font-size:10px;color:var(--tint);font-weight:600">确认</span>
      </div>
    </div>

    <div class="screen-body" style="padding-bottom:32px">
      <!-- 摘要卡片 -->
      <div style="margin-top:16px;background:var(--bg2);border-radius:var(--r);overflow:hidden">
        <div style="padding:16px;border-bottom:1px solid var(--separator)">
          <div style="font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">会话摘要</div>
          <div style="display:flex;align-items:center;gap:12px">
            <span style="font-size:32px">📁</span>
            <div>
              <div style="font-size:18px;font-weight:700">HelloBug</div>
              <div style="font-size:13px;color:var(--fg2);margin-top:2px;font-family:var(--font-mono)">~/projects/HelloBug</div>
            </div>
          </div>
        </div>
        <div class="card-row">
          <span style="color:var(--fg2);font-size:14px;width:72px;flex-shrink:0">设备</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:16px">💻</span>
            <span style="font-size:15px">MacBook Pro</span>
            <span class="pill-label green" style="font-size:11px">在线</span>
          </div>
        </div>
        <div class="card-row">
          <span style="color:var(--fg2);font-size:14px;width:72px;flex-shrink:0">Agent</span>
          <span style="font-size:15px">Claude Code</span>
        </div>
        <div class="card-row">
          <span style="color:var(--fg2);font-size:14px;width:72px;flex-shrink:0">模型</span>
          <span style="font-size:15px">claude-sonnet-4</span>
        </div>
      </div>

      <!-- 初始消息 -->
      <div class="section-header">初始任务（可选）</div>
      <div style="background:var(--bg2);border-radius:var(--r);overflow:hidden">
        <textarea style="width:100%;background:none;border:none;outline:none;font-size:15px;color:var(--fg);font-family:inherit;resize:none;padding:14px 16px;min-height:90px;line-height:1.5" placeholder="描述你想让 Agent 做什么（可留空直接进入聊天）">帮我补全 router.dart 里缺失的路由入口，参考 flutter-tasks.md</textarea>
      </div>

      <!-- 高级选项折叠 -->
      <div style="margin-top:12px">
        <div style="display:flex;align-items:center;padding:12px 16px;background:var(--bg2);border-radius:var(--r);cursor:pointer;gap:10px">
          <span style="font-size:16px">⚙️</span>
          <span style="font-size:15px;flex:1">高级选项</span>
          <span style="color:var(--fg3);font-size:14px">展开 ›</span>
        </div>
      </div>

      <!-- 安全提示 -->
      <div style="margin-top:12px;padding:12px 14px;background:rgba(255,149,0,.1);border-radius:var(--r);display:flex;gap:10px;align-items:flex-start">
        <span style="font-size:16px">🛡</span>
        <div style="font-size:13px;color:var(--orange);line-height:1.5">当前已启用 3 条危险规则。Agent 的危险操作将被自动拦截。</div>
      </div>

      <!-- 开始按钮 -->
      <div style="margin-top:20px">
        <button class="btn btn-primary" style="width:100%;font-size:17px;padding:16px">🚀 开始会话</button>
      </div>
      <div style="margin-top:10px">
        <button class="btn btn-secondary" style="width:100%;font-size:15px">取消</button>
      </div>
    </div>
  </div>
</div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = isDark ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
