<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>38 · 快捷模板编辑表单</title>
<link rel="stylesheet" href="_common.css">
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">☀ 浅色</button>
<div class="phone-wrap">

  <!-- A: 新建模板 -->
  <div class="phone-label">38-A · 快捷模板 — 新建</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg>
      </div>
    </div>
    <div class="nav">
      <div class="nav-back" style="color:var(--tint)">取消</div>
      <div class="nav-title">新建模板</div>
      <button style="color:var(--fg3);font-size:15px;background:none;border:none;cursor:pointer;opacity:.4">保存</button>
    </div>

    <div class="screen-body" style="padding-bottom:32px">
      <div class="section-header">基本信息</div>
      <div class="list-group">
        <div class="list-item">
          <span class="list-label">名称</span>
          <input style="flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--fg3);text-align:right" placeholder="如：修复 Bug">
        </div>
        <div class="list-item">
          <span class="list-label">触发词</span>
          <div style="display:flex;align-items:center;gap:4px">
            <span style="font-family:var(--font-mono);font-size:13px;color:var(--fg3)">/</span>
            <input style="width:90px;background:none;border:none;outline:none;font-size:15px;font-family:var(--font-mono);color:var(--fg3);text-align:right" placeholder="fix">
          </div>
        </div>
      </div>
      <div style="padding:2px 16px 12px;font-size:12px;color:var(--fg3)">输入 / 后跟触发词即可插入模板，如 <code style="font-family:var(--font-mono)">/fix</code></div>

      <div class="section-header">模板内容</div>
      <div class="list-group">
        <div style="padding:12px 16px">
          <textarea style="width:100%;min-height:120px;background:none;border:none;outline:none;font-size:14px;color:var(--fg3);resize:none;font-family:var(--font-ui);line-height:1.6;box-sizing:border-box" placeholder="请帮我找到并修复以下代码中的 Bug：&#10;&#10;{{选中内容}}&#10;&#10;要求：&#10;- 解释 Bug 原因&#10;- 提供修复代码"></textarea>
        </div>
      </div>
      <div style="padding:2px 16px 12px;font-size:12px;color:var(--fg3)">使用 <code style="font-family:var(--font-mono)">{{选中内容}}</code> 插入当前聊天中选中的文字</div>

      <div class="section-header">图标</div>
      <div class="list-group">
        <div class="list-item">
          <span class="list-label">Emoji</span>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:32px;height:32px;background:var(--bg3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px">🔧</div>
            <span style="color:var(--tint);font-size:14px">更改</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- B: 编辑已有模板 -->
  <div class="phone-label">38-B · 快捷模板 — 编辑</div>
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".3"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v3a1.5 1.5 0 000-3z"/></svg>
      </div>
    </div>
    <div class="nav">
      <div class="nav-back" style="color:var(--tint)">取消</div>
      <div class="nav-title">编辑模板</div>
      <button style="color:var(--tint);font-size:15px;background:none;border:none;cursor:pointer;font-weight:600">保存</button>
    </div>

    <div class="screen-body" style="padding-bottom:32px">
      <div class="section-header">基本信息</div>
      <div class="list-group">
        <div class="list-item">
          <span class="list-label">名称</span>
          <input style="flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--fg);text-align:right" value="修复 Bug">
        </div>
        <div class="list-item">
          <span class="list-label">触发词</span>
          <div style="display:flex;align-items:center;gap:4px">
            <span style="font-family:var(--font-mono);font-size:13px;color:var(--fg2)">/</span>
            <input style="width:90px;background:none;border:none;outline:none;font-size:15px;font-family:var(--font-mono);color:var(--fg);text-align:right" value="fix">
          </div>
        </div>
      </div>

      <div class="section-header">模板内容</div>
      <div class="list-group">
        <div style="padding:12px 16px">
          <textarea style="width:100%;min-height:110px;background:none;border:none;outline:none;font-size:14px;color:var(--fg);resize:none;font-family:var(--font-ui);line-height:1.6;box-sizing:border-box">请帮我找到并修复以下代码中的 Bug：

{{选中内容}}

要求：
- 解释 Bug 原因
- 提供修复代码</textarea>
        </div>
      </div>

      <div class="section-header">图标</div>
      <div class="list-group">
        <div class="list-item">
          <span class="list-label">Emoji</span>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:32px;height:32px;background:var(--bg3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px">🔧</div>
            <span style="color:var(--tint);font-size:14px">更改</span>
          </div>
        </div>
      </div>

      <!-- 删除区 -->
      <div style="margin-top:24px">
        <div class="list-group">
          <div class="list-item" style="justify-content:center">
            <span style="color:var(--red);font-size:15px">删除此模板</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = isDark ? '🌙 深色' : '☀ 浅色';
}
</script>
</body>
</html>
